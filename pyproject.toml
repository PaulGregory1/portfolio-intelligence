[project]
name = "portfolio-intelligence"
version = "0.1.0"
description = "Natural-language portfolio analytics agent with a hand-written tool-calling harness, grounding checks and a model evaluation suite."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0.0",
    "mcp>=2.3.0",
    "numpy>=2.5.4",
    "openai>=3.42.0",
    "pandas>=3.1.0",
    "pydantic>=2",
    "pydantic-settings>=2.16.2",
    "rank-bm25>=0.2.2",
    "rich>=15.0.0",
    "typer>=0.27.3",
    "yfinance>=1.7.0",
]

[project.scripts]
pi = "pi.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pi"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument", "pathlib.Path"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["yfinance.*", "rank_bm25.*", "duckdb.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pandas-stubs>=3.1.0.261029",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]
